spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  data:
    redis:
      host: localhost
      port: 6379

logging:
  level:
    org.hibernate.SQL: debug
#    org.hibernate.orm.jdbc.bind: trace

token:
  # 테스트 전용 키. 실제 운영 환경에서는 절대 사용 금지. 256-bit 이상 무작위 키를 환경변수로 주입.
  secret-key: ${TOKEN_SECRET_KEY:dGVzdC1vbmx5LWtleS1kby1ub3QtdXNlLWluLXByb2QtbWluaW11bS0yNTYtYml0LWxlbmd0aA==}
  access-token-expiration-millis: 86400000
  refresh-token-expiration-millis: 1209600000
